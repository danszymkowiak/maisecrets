[project]
name = "maisecrets-redact"
version = "0.1.0"
description = "Redact documents before they reach a language model: the maisecrets rules plus local PII models (docs/REDACT.md)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pypdf>=5",
]

[project.optional-dependencies]
# local PII models (TASK-34.4): uv sync --project redact --extra models. torch comes from its CPU index: no GPU stack
models = [
    "torch>=2.3",
    "transformers>=4.44",
    "gliner>=0.2.13",
    # the mDeBERTa tokenizer of urchade/gliner_multi_pii-v1 does not load without them (measured 2026-10-12)
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
redact = "maisecrets_redact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maisecrets_redact"]
