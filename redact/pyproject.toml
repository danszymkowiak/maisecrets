[project]
name = "maisecrets-redact"
version = "0.1.0"
description = "Redact documents before they reach a language model: the maisecrets rules plus local PII models (docs/REDACT.md)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pypdf>=5",
]

[project.optional-dependencies]
# local PII models (TASK-34.4): uv sync --project redact --extra models. torch comes from its CPU index: no GPU stack
models = [
    "torch>=2.3",
    "transformers>=4.44",
    "gliner>=0.2.13",
    # the mDeBERTa tokenizer of urchade/gliner_multi_pii-v1 does not load without them (measured 2026-10-12)
    "sentencepiece>=0.2",
    "protobuf>=4",
    # gliner2's local model class (the [local] extra); its hosted-API client is never used
    "gliner2[local]>=2.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
redact = "maisecrets_redact.adapters.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["maisecrets_redact"]

# Clean architecture, adapters > application > domain (TASK-62; the spec is backlog/docs/doc-1 in the repository).
[tool.importlinter]
root_package = "maisecrets_redact"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers: adapters > application > domain"
type = "layers"
containers = ["maisecrets_redact"]
layers = ["adapters", "application", "domain"]

[[tool.importlinter.contracts]]
name = "the adapters that implement ports are independent of each other"
type = "independence"
modules = [
    "maisecrets_redact.adapters.extract",
    "maisecrets_redact.adapters.plugin_rules",
    "maisecrets_redact.adapters.model_backends",
    "maisecrets_redact.adapters.review_file",
    "maisecrets_redact.adapters.files",
]

[[tool.importlinter.contracts]]
name = "domain and application import no plugin, model library or file format"
type = "forbidden"
source_modules = ["maisecrets_redact.domain", "maisecrets_redact.application"]
forbidden_modules = ["maisecrets", "gliner", "gliner2", "transformers", "torch", "pypdf", "openpyxl", "pyarrow"]

[[tool.importlinter.contracts]]
name = "the domain does no I/O: no files, processes, clock or environment"
type = "forbidden"
source_modules = ["maisecrets_redact.domain"]
forbidden_modules = ["os", "time", "tempfile", "subprocess", "multiprocessing", "concurrent", "tomllib", "importlib",
                     "shutil", "socket", "urllib"]
