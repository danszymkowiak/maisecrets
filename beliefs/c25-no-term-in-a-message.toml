# c25-no-term-in-a-message: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c25-no-term-in-a-message"
control = "C25"
statement = "A refusal of terms.txt names the file and a line number, never the text of the line: not in the hook answer, a log, the incident record or the status."
runner = ["tests/test_terms_leaks.py::ErrorPathTests::test_every_refusal_of_the_file_names_a_line_and_never_its_text"]

[proof]
file = "maisecrets/terms.py"
find = "            raise TermsError(f\"line {n}: the label appears on an earlier line\", n)"
replace = "            raise TermsError(f\"line {n}: the label appears on an earlier line: {rest}\", n)"
