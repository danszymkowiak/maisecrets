# nvidia/Nemotron-PII: span label -> maisecrets type (docs/BENCHMARK.md, What counts). In scope where maisecrets
# claims the type. Decisions (TASK-11.34, 2026-10-12):
# - fax_number is a phone number in shape: PHONE.
# - account_number: US_BANK_NUMBER (the us-bank rule); the intl locale's account numbers are scored apart by tag.
# - ssn: US_SSN; the intl locale's national numbers carry the label national_id, which no one type covers.
# - tax_id mixes SSN, ITIN and EIN shapes (and 123-45-6789 placeholders): out of scope, so a US_SSN hit on one is
#   neither a find nor a false alarm.
# - http_cookie is mostly a preference or analytics cookie (gdpr_consent=allowed); a session cookie would be a
#   secret, but the label does not tell them apart: out of scope.
# - pin, cvv, swift_bic, customer and employee ids, licence and record numbers have no shape maisecrets claims
#   (as for Gretel): out of scope.

[labels]
email = "EMAIL"
phone_number = "PHONE"
fax_number = "PHONE"
ipv4 = "IP"
ipv6 = "IP"
credit_debit_card = "CARD"
password = "SECRET"
api_key = "SECRET"
ssn = "US_SSN"
bank_routing_number = "ABA_ROUTING_NUMBER"
account_number = "US_BANK_NUMBER"
tax_id = "OUT_OF_SCOPE"
http_cookie = "OUT_OF_SCOPE"
national_id = "OUT_OF_SCOPE"
pin = "OUT_OF_SCOPE"
cvv = "OUT_OF_SCOPE"
swift_bic = "OUT_OF_SCOPE"
customer_id = "OUT_OF_SCOPE"
