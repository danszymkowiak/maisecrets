name = "Generic rules: skip wordlike-44"
why = "TASK-11.22. Word coverage above 0.444 outside a strong label (dev: keeps 99.5% of the finds)."

[[change]]
op = "set"
rule = "generic-api-key"
filter = "bench:wordlike_44"

[[change]]
op = "set"
rule = "ds-keyword-colon"
filter = "bench:wordlike_44"

[[change]]
op = "set"
rule = "ds-keyword-equal-signs"
filter = "bench:wordlike_44"

[[change]]
op = "set"
rule = "ds-basic-auth"
filter = "bench:wordlike_44"

[[change]]
op = "set"
rule = "ds-keyword-arrow-function-sign-quotes-required"
filter = "bench:wordlike_44"

[[change]]
op = "set"
rule = "ds-keyword-quotes-and-semicolon"
filter = "bench:wordlike_44"
