name = "Generic rules: skip object id"
why = "TASK-11.20. A 24-hex MongoDB ObjectId inside ObjectId(...) or behind an _id/oid label."

[[change]]
op = "set"
rule = "generic-api-key"
filter = "bench:object_id"

[[change]]
op = "set"
rule = "ds-keyword-colon"
filter = "bench:object_id"

[[change]]
op = "set"
rule = "ds-keyword-equal-signs"
filter = "bench:object_id"

[[change]]
op = "set"
rule = "ds-basic-auth"
filter = "bench:object_id"

[[change]]
op = "set"
rule = "ds-keyword-arrow-function-sign-quotes-required"
filter = "bench:object_id"

[[change]]
op = "set"
rule = "ds-keyword-quotes-and-semicolon"
filter = "bench:object_id"
