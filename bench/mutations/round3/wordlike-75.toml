name = "Generic rules: skip wordlike-75"
why = "TASK-11.22. Word coverage above 0.75 outside a strong label (dev: 201 false alarms, no find)."

[[change]]
op = "set"
rule = "generic-api-key"
filter = "bench:wordlike_75"

[[change]]
op = "set"
rule = "ds-keyword-colon"
filter = "bench:wordlike_75"

[[change]]
op = "set"
rule = "ds-keyword-equal-signs"
filter = "bench:wordlike_75"

[[change]]
op = "set"
rule = "ds-basic-auth"
filter = "bench:wordlike_75"

[[change]]
op = "set"
rule = "ds-keyword-arrow-function-sign-quotes-required"
filter = "bench:wordlike_75"

[[change]]
op = "set"
rule = "ds-keyword-quotes-and-semicolon"
filter = "bench:wordlike_75"
