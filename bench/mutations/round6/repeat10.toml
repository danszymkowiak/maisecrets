name = "Generic rules: skip a value seen 10+ times in the text"
why = "TASK-11.27 (a). repeat3 lost 154 finds (Nemotron 151); at ten repeats no find of the bench is lost."

[[change]]
op = "set"
rule = "generic-api-key"
filter = "bench:repeat10"

[[change]]
op = "set"
rule = "ds-keyword-colon"
filter = "bench:repeat10"

[[change]]
op = "set"
rule = "ds-keyword-equal-signs"
filter = "bench:repeat10"

[[change]]
op = "set"
rule = "ds-basic-auth"
filter = "bench:repeat10"

[[change]]
op = "set"
rule = "ds-keyword-arrow-function-sign-quotes-required"
filter = "bench:repeat10"

[[change]]
op = "set"
rule = "ds-keyword-quotes-and-semicolon"
filter = "bench:repeat10"
